variables:
  SMOKE_PRODUCT_NAME: 22

include:
  - project: "ci/repos-ci/pentagon_l1_vip_sedie_service"
    ref: master
    file: "gitlab-ci.yml"

.if-deploy-local: &if-deploy-local
  if: '$CI_COMMIT_TAG =~ /local/'

.if-deploy-sit: &if-deploy-sit
  if: '$CI_COMMIT_TAG =~ /sit/'

.if-deploy-uat: &if-deploy-uat
  if: '$CI_COMMIT_TAG =~ /uat/'

.if-deploy-prod: &if-deploy-prod
  if: '$CI_COMMIT_TAG =~ /prod/'

integration-tests:
  stage: test
  needs: ['unit-test-js']
  tags:
    - docker

  services:
    - name: registry.nexdev.net:5050/docker/database/mongo:4.4.8
      alias: mongo
      
  image: registry.nexdev.net:5050/docker/node:14.15.1-slim
  before_script:
    - cp ./src/app-configs.IGT.js ./src/app-configs.IGT.original.js
    - cp ./configs/app-configs.IGT.js ./src/app-configs.IGT.js
    - npm set registry http://npm.lumigame.com
    - yarn install

  script:
    - npm run integration-test

  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'

  artifacts:
    when: always
    paths:
      - ./coverage
    reports:
      junit:
        - junit.xml
    expire_in: 1 day

unit-test-js:
  artifacts:
    reports:
      junit: coverage/*.xml
      cobertura: coverage/cobertura-coverage.xml

smoke-test:
  stage: post-deploy
  variables:
    PRODUCT: $SMOKE_PRODUCT_NAME
    PROJECT: $SMOKE_PROJECT_NAME
    MODE: $SMOKE_MODE
  allow_failure: true
  script:
    - echo $CI_ENVIRONMENT_NAME
    - echo $CI_COMMIT_TAG
  rules:
    - if: '$CI_COMMIT_TAG =~ /^deploy-.*-local\d*-.*/ && $DEPLOY_BY == "rocketor"'
  trigger: 
    project: rnd/testing/trigger-auto-sc1
    branch: master


variables:
    SMOKE_PRODUCT_NAME: 22
    DOCKER_SLIM: enable
    ENABLE_NODEJS_INTEGRATION_TEST: 'true'
    NODEJS_INTEGRATION_TEST_IMAGE_VERSION: registry.nexdev.net:5050/docker/node:18.1-buster-slim
    NODEJS_INTEGRATION_TEST_DB_IMAGE_VERSION: registry.nexdev.net:5050/docker/database/mongo:4.4.8
  
include:
    - project: "ci/repos-ci/pentagon_l1_vip_sedie_service"
      ref: master
      file: "gitlab-ci.yml"
    - project: "ci/repos-ci/pentagon_l2_vip_sedie_service"
      ref: master
      file: "gitlab-ci-mixing.yml"
    - project: "ci/common-ci"
      ref: rocketor
      file: "integration-test/nodejs-integration-test.gitlab-ci.yml"

unit-test-js:
  image: registry.nexdev.net:5050/docker/node:18.1-buster-slim

smoke-test:
  stage: post-deploy
  variables:
    PRODUCT: $SMOKE_PRODUCT_NAME
    PROJECT: $SMOKE_PROJECT_NAME
    MODE: $SMOKE_MODE
    ENV: $TRANSFORM_CONFIG
  allow_failure: true
  rules:
    - if: '$CI_COMMIT_TAG =~ /^deploy-.*-local\d*-.*/ && $DEPLOY_BY == "rocketor"'
  trigger: 
    project: rnd/testing/trigger-auto-sc1
    branch: master